
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Animations</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eef3f8;
}

.scene {
  background: white;
  margin: 20px auto;
  padding: 20px;
  max-width: 800px;
  border-radius: 12px;
}

h1 { color: #173b70; }

/* 1. Bouncing Ball */
.ball-stage {
  height: 200px;
  position: relative;
  overflow: hidden;
  background: #eaf6ff;
  border-bottom: 8px solid #555;
}

.ball {
  width: 50px;
  height: 50px;
  background: red;
  border-radius: 50%;
  position: absolute;
  bottom: 0;
  left: calc(50% - 25px);
  animation: bounce 1s ease-in-out infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-140px); }
}

/* 2. Car moving to and fro */
.car-stage {
  height: 150px;
  position: relative;
  overflow: hidden;
  background: #dff1ff;
}

.road {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45px;
  background: #444;
}

.car {
  position: absolute;
  bottom: 35px;
  left: 0;
  width: 100px;
  height: 40px;
  animation: drive 4s ease-in-out infinite alternate;
}

.car-body {
  position: absolute;
  bottom: 0;
  width: 100px;
  height: 25px;
  background: red;
  border-radius: 10px;
}

.car-top {
  position: absolute;
  bottom: 22px;
  left: 22px;
  width: 55px;
  height: 20px;
  background: red;
  border-radius: 12px 12px 0 0;
}

.window {
  position: absolute;
  bottom: 26px;
  left: 32px;
  width: 35px;
  height: 12px;
  background: skyblue;
}

.wheel {
  position: absolute;
  bottom: -7px;
  width: 20px;
  height: 20px;
  background: black;
  border-radius: 50%;
}

.left { left: 12px; }
.right { right: 12px; }

@keyframes drive {
  from { left: 0; }
  to { left: calc(100% - 100px); }
}

/* 3. Moon orbiting Earth */
.space {
  height: 300px;
  background: #07132e;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.earth {
  width: 90px;
  height: 90px;
  background: #1685dc;
  border-radius: 50%;
  box-shadow: 0 0 20px #1685dc;
  z-index: 2;
}

.orbit {
  width: 220px;
  height: 220px;
  border: 1px solid white;
  border-radius: 50%;
  position: absolute;
  animation: orbit 5s linear infinite;
}

.moon {
  width: 30px;
  height: 30px;
  background: #ddd;
  border-radius: 50%;
  position: absolute;
  top: -15px;
  left: calc(50% - 15px);
}

@keyframes orbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<h1>Three CSS Animations</h1>

<section class="scene">
  <h2>1. Bouncing Ball</h2>
  <div class="ball-stage">
    <div class="ball"></div>
  </div>
  <p>The ball moves up and down repeatedly.</p>
</section>

<section class="scene">
  <h2>2. To-and-Fro Movement of a Car</h2>
  <div class="car-stage">
    <div class="road"></div>
    <div class="car">
      <div class="car-top"></div>
      <div class="window"></div>
      <div class="car-body"></div>
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>
  </div>
  <p>The car moves forward and backward.</p>
</section>

<section class="scene">
  <h2>3. Moon Orbiting Earth</h2>
  <div class="space">
    <div class="earth"></div>
    <div class="orbit">
      <div class="moon"></div>
    </div>
  </div>
  <p>The Moon moves around Earth.</p>
</section>

</body>
</html>
